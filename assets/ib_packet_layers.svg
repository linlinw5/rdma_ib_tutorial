<svg viewBox="0 0 1100 710" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="1100" height="710" fill="#FAFAF8"/>

  <!-- ===================== LAYER BRACKET CONNECTORS ===================== -->
  <!-- nested: DataLink (LRH..VCRC, owns ICRC+VCRC) > Network (GRH..Payload) > Transport (BTH..Payload) -->
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <!-- Data Link Layer (green) -->
    <g stroke="#548235">
      <path d="M 60,190 V 624 Q 60,640 76,640 H 414"/>
      <path d="M 1028,190 V 624 Q 1028,640 1012,640 H 674"/>
    </g>
    <!-- Network Layer (gray) -->
    <g stroke="#808080">
      <path d="M 198,190 V 504 Q 198,520 214,520 H 439"/>
      <path d="M 802,190 V 504 Q 802,520 786,520 H 679"/>
    </g>
    <!-- Transport Layer (orange) -->
    <g stroke="#ED7D31">
      <path d="M 326,190 V 384 Q 326,400 342,400 H 503"/>
      <path d="M 802,190 V 384 Q 802,400 786,400 H 743"/>
    </g>
  </g>

  <!-- ===================== LAYER LABEL BOXES ===================== -->
  <rect x="503" y="372" width="240" height="56" rx="14" fill="#FCE4CE" stroke="#ED7D31" stroke-width="2.5"/>
  <text x="623" y="408" text-anchor="middle" font-size="22" font-weight="600" fill="#333">Transport Layer</text>

  <rect x="439" y="492" width="240" height="56" rx="14" fill="#EDEDED" stroke="#808080" stroke-width="2.5"/>
  <text x="559" y="528" text-anchor="middle" font-size="22" font-weight="600" fill="#333">Network Layer</text>

  <rect x="414" y="612" width="260" height="56" rx="14" fill="#E2EFDA" stroke="#548235" stroke-width="2.5"/>
  <text x="544" y="648" text-anchor="middle" font-size="22" font-weight="600" fill="#333">Data Link Layer</text>

  <!-- ===================== PACKET FIELD BOXES ===================== -->
  <!-- each box: size (top) + name (below) -->

  <!-- LRH (green) -->
  <rect x="60" y="60" width="130" height="130" rx="16" fill="#A9D08E" stroke="#548235" stroke-width="2.5"/>
  <text x="125" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#3d5e22">8 Bytes</text>
  <text x="125" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">LRH</text>

  <!-- GRH (purple) -->
  <rect x="198" y="60" width="120" height="130" rx="16" fill="#C5ADE0" stroke="#7E60A8" stroke-width="2.5"/>
  <text x="258" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#523a7a">40 Bytes</text>
  <text x="258" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">GRH</text>

  <!-- BTH (gold/yellow) -->
  <rect x="326" y="60" width="130" height="130" rx="16" fill="#FFD24D" stroke="#CC9A06" stroke-width="2.5"/>
  <text x="391" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#6b5200">12 Bytes</text>
  <text x="391" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">BTH</text>

  <!-- ETH (gold/yellow) -->
  <rect x="464" y="60" width="130" height="130" rx="16" fill="#FFD24D" stroke="#CC9A06" stroke-width="2.5"/>
  <text x="529" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#6b5200">Var Bytes</text>
  <text x="529" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">ETH</text>

  <!-- Payload (blue) -->
  <rect x="602" y="60" width="200" height="130" rx="16" fill="#9DC3E6" stroke="#2E75B6" stroke-width="2.5"/>
  <text x="702" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#1f4e79">0..4069 Bytes</text>
  <text x="702" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">Payload</text>

  <!-- ICRC (green) -->
  <rect x="810" y="60" width="110" height="130" rx="16" fill="#A9D08E" stroke="#548235" stroke-width="2.5"/>
  <text x="865" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#3d5e22">4 Bytes</text>
  <text x="865" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">ICRC</text>

  <!-- VCRC (green) -->
  <rect x="928" y="60" width="100" height="130" rx="16" fill="#A9D08E" stroke="#548235" stroke-width="2.5"/>
  <text x="978" y="113" text-anchor="middle" font-size="18" font-weight="500" fill="#3d5e22">2 Bytes</text>
  <text x="978" y="145" text-anchor="middle" font-size="22" font-weight="600" fill="#2b2b2b">VCRC</text>
</svg>
