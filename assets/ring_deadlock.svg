<svg viewBox="0 110 820 525" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <!-- background -->
  <rect x="0" y="110" width="820" height="525" fill="#FAFAF8"/>

  <!-- markers -->
  <defs>
    <marker id="trafficHead" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="13" refY="7" orient="auto">
      <path d="M0,0 L15,7 L0,14 Z" fill="#C55A11"/>
    </marker>
  </defs>

  <!-- ===================== PHYSICAL RING LINKS (saturated, traffic direction) ===================== -->
  <g stroke="#ED7D31" stroke-width="4" fill="none">
    <line x1="287" y1="180" x2="529" y2="180" marker-end="url(#trafficHead)"/>  <!-- A->B top -->
    <line x1="600" y1="227" x2="600" y2="471" marker-end="url(#trafficHead)"/>  <!-- B->C right -->
    <line x1="533" y1="520" x2="291" y2="520" marker-end="url(#trafficHead)"/>  <!-- C->D bottom -->
    <line x1="220" y1="473" x2="220" y2="229" marker-end="url(#trafficHead)"/>  <!-- D->A left -->
  </g>

  <!-- link labels -->
  <g font-size="15" text-anchor="middle">
    <text x="408" y="152" font-weight="600" fill="#2b2b2b">A→B</text>
    <text x="408" y="170" font-weight="700" fill="#C55A11">FULL</text>
    <text x="408" y="548" font-weight="600" fill="#2b2b2b">C→D</text>
    <text x="408" y="566" font-weight="700" fill="#C55A11">FULL</text>
  </g>
  <g font-size="15" text-anchor="start">
    <text x="624" y="346" font-weight="600" fill="#2b2b2b">B→C</text>
    <text x="624" y="365" fill="#C55A11" font-weight="700">FULL</text>
  </g>
  <g font-size="15" text-anchor="end">
    <text x="196" y="346" font-weight="600" fill="#2b2b2b">D→A</text>
    <text x="196" y="365" fill="#C55A11" font-weight="700">FULL</text>
  </g>

  <!-- ===================== BUFFER DEPENDENCY (wait-for) CYCLE — the deadlock ===================== -->
  <path d="M 330,240 H 490 Q 520,240 520,270 V 430 Q 520,460 490,460 H 330 Q 300,460 300,430 V 270 Q 300,240 330,240 Z"
        fill="none" stroke="#C00000" stroke-width="2.5" stroke-dasharray="7 6"/>
  <!-- clockwise arrowheads mid-side -->
  <g fill="#C00000">
    <path d="M 402,234 L 416,240 L 402,246 Z"/>            <!-- top: points right -->
    <path d="M 514,344 L 520,358 L 526,344 Z"/>            <!-- right: points down -->
    <path d="M 418,454 L 404,460 L 418,466 Z"/>            <!-- bottom: points left -->
    <path d="M 294,356 L 300,342 L 306,356 Z"/>            <!-- left: points up -->
  </g>

  <!-- center label -->
  <text x="410" y="344" text-anchor="middle" font-size="27" font-weight="800" fill="#C00000" letter-spacing="1">DEADLOCK</text>
  <text x="410" y="372" text-anchor="middle" font-size="13.5" fill="#8a3030">buffer wait-for cycle</text>

  <!-- ===================== SWITCH NODES ===================== -->
  <g>
    <!-- SwA top-left -->
    <rect x="155" y="135" width="130" height="90" rx="14" fill="#9DC3E6" stroke="#2E75B6" stroke-width="2.5"/>
    <text x="220" y="172" text-anchor="middle" font-size="23" font-weight="700" fill="#1f3a5f">SwA</text>
    <text x="220" y="198" text-anchor="middle" font-size="14" fill="#2E75B6">LID 1</text>
    <!-- SwB top-right -->
    <rect x="535" y="135" width="130" height="90" rx="14" fill="#9DC3E6" stroke="#2E75B6" stroke-width="2.5"/>
    <text x="600" y="172" text-anchor="middle" font-size="23" font-weight="700" fill="#1f3a5f">SwB</text>
    <text x="600" y="198" text-anchor="middle" font-size="14" fill="#2E75B6">LID 3</text>
    <!-- SwC bottom-right -->
    <rect x="535" y="475" width="130" height="90" rx="14" fill="#9DC3E6" stroke="#2E75B6" stroke-width="2.5"/>
    <text x="600" y="512" text-anchor="middle" font-size="23" font-weight="700" fill="#1f3a5f">SwC</text>
    <text x="600" y="538" text-anchor="middle" font-size="14" fill="#2E75B6">LID 6</text>
    <!-- SwD bottom-left -->
    <rect x="155" y="475" width="130" height="90" rx="14" fill="#9DC3E6" stroke="#2E75B6" stroke-width="2.5"/>
    <text x="220" y="512" text-anchor="middle" font-size="23" font-weight="700" fill="#1f3a5f">SwD</text>
    <text x="220" y="538" text-anchor="middle" font-size="14" fill="#2E75B6">LID 7</text>
  </g>

  <!-- corner position tags (A/B/C/D ring positions) -->
  <g font-size="13" fill="#9a9a9a" font-style="italic">
    <text x="150" y="128" text-anchor="end">A</text>
    <text x="670" y="128" text-anchor="start">B</text>
    <text x="670" y="585" text-anchor="start">C</text>
    <text x="150" y="585" text-anchor="end">D</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g transform="translate(160,612)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#ED7D31" stroke-width="4" marker-end="url(#trafficHead)"/>
    <text x="44" y="5" font-size="13.5" fill="#444">saturated link · traffic direction</text>
    <line x1="320" y1="0" x2="354" y2="0" stroke="#C00000" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="364" y="5" font-size="13.5" fill="#444">buffer dependency · wait-for</text>
  </g>
</svg>
